trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

steps:
- task: UseRubyVersion@0
  displayName: 'Use Ruby 3.1'
  inputs:
    versionSpec: '3.1'

- script: |
    gem install bundler -v 2.3.17 --no-document
    bundle _2.3.17_ install --jobs 4
    bundle _2.3.17_ exec jekyll build
  displayName: 'Build Jekyll site'

- task: PublishBuildArtifacts@1
  displayName: 'Publish site artifact'
  inputs:
    PathtoPublish: '_site/azure-sdk'
    ArtifactName: 'sesyse-site'
    publishLocation: 'Container'
